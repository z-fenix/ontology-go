# Local development stack. Usage: make dev-up
name: ontology-dev

services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: onto
      POSTGRES_PASSWORD: onto
      POSTGRES_DB: ontology
    ports: ["5432:5432"]
    volumes:
      - ./deploy/dev/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      # postgres 18+ stores data in a major-version-specific subdirectory (PGDATA is
      # /var/lib/postgresql/19/docker), so the volume must mount at the parent. Mounting
      # at /var/lib/postgresql/data leaves the volume unused and the entrypoint refuses
      # to start. See https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onto -d ontology"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./migrations:/migrations:ro"]
    command: ["-path=/migrations", "-database=postgres://onto:onto@postgres:5432/ontology?sslmode=disable", "up"]
    restart: on-failure

  openfga-migrate:
    image: openfga/openfga
    depends_on:
      postgres: { condition: service_healthy }
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://onto:onto@postgres:5432/openfga?sslmode=disable
    restart: on-failure

  openfga:
    image: openfga/openfga
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://onto:onto@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports: ["8090:8080"]

  temporal:
    image: temporalio/auto-setup
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: onto
      POSTGRES_PWD: onto
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]

  mock-mro:          # stands in for the external MRO system (webhook write-back target)
    image: mockserver/mockserver:5.15.0
    ports: ["1080:1080"]

volumes:
  pgdata:
